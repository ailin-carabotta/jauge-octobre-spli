<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contrôle de la jauge HyperX</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090a0d;color:#fff;font:16px Arial,sans-serif;padding:20px}.panel{width:min(520px,100%);padding:28px;background:#15171c;border:1px solid #ff1848;border-radius:14px;box-shadow:0 0 30px #ff184833}h1{margin:0 0 8px;color:#ff1848}.hint{color:#aeb2bc;margin:0 0 24px}.value{font-size:72px;font-weight:800;text-align:center;margin:20px}.value span{color:#ff1848;font-size:.5em}.actions,.steps{display:grid;gap:10px}.actions{grid-template-columns:1fr 1fr;margin-bottom:18px}.steps{grid-template-columns:repeat(4,1fr)}button{min-height:48px;border:1px solid #ff526f;border-radius:8px;background:#e30e3b;color:white;font-weight:800;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.15)}button.secondary{background:#292c33;border-color:#555}.status{text-align:center;min-height:22px;color:#8ee5a8;margin-top:16px}
  </style>
</head>
<body>
  <main class="panel">
    <h1>Contrôle HyperX</h1><p class="hint">Ce panneau commande directement la source OBS.</p>
    <section id="controls">
      <div id="value" class="value">0<span>%</span></div>
      <div class="actions"><button id="previous" class="secondary">← Précédent</button><button id="next">Suivant +</button></div>
      <div id="steps" class="steps"></div>
      <button id="reset" class="secondary" style="width:100%;margin-top:18px">Réinitialiser à 0 %</button>
    </section>
    <div id="status" class="status"></div>
  </main>
  <script src="firebase-config.js"></script>
  <script type="module">
    import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
    const levels=[0,3,6,9,12,15,18,21,24,27,30];let current=0;
    const app=initializeApp(window.FIREBASE_CONFIG),db=getDatabase(app),gaugeRef=ref(db,"hyperxGauge/progress");
    const status=document.getElementById("status"),value=document.getElementById("value"),steps=document.getElementById("steps");
    function message(t,error=false){status.textContent=t;status.style.color=error?"#ff7a91":"#8ee5a8"}
    async function write(v){try{await set(gaugeRef,v);message("Jauge mise à jour : "+v+" %")}catch(e){console.error("Mise à jour Firebase refusée",e);message("Impossible de modifier la jauge : "+(e.code||e.message||"erreur inconnue"),true)}}
    levels.forEach(v=>{const b=document.createElement("button");b.textContent=v+" %";b.className=v===0?"secondary":"";b.onclick=()=>write(v);steps.appendChild(b)});
    onValue(gaugeRef,s=>{current=levels.includes(Number(s.val()))?Number(s.val()):0;value.innerHTML=current+"<span>%</span>"});
    document.getElementById("next").onclick=()=>write(levels[Math.min(levels.indexOf(current)+1,levels.length-1)]);
    document.getElementById("previous").onclick=()=>write(levels[Math.max(levels.indexOf(current)-1,0)]);
    document.getElementById("reset").onclick=()=>write(0);
    message("Prêt à déclencher");
  </script>
</body>
</html>
